name: Build x64

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: build-x64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONFIGURATION: Release
  PLATFORM: x64
  SOLUTION: TrayS.sln

jobs:
  build:
    name: MSBuild Release|x64
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Cache MSBuild intermediates
        uses: actions/cache@v4
        with:
          path: build\obj
          key: msbuild-${{ env.PLATFORM }}-${{ env.CONFIGURATION }}-${{ runner.os }}-${{ hashFiles('**/*.{cpp,h,hpp,c,rc,vcxproj,props,sln,filters,dll,lib}') }}
          restore-keys: |
            msbuild-${{ env.PLATFORM }}-${{ env.CONFIGURATION }}-${{ runner.os }}-

      - name: Build OpenHardwareMonitorApi (x64)
        shell: pwsh
        run: |
          msbuild "OpenHardwareMonitorApi\OpenHardwareMonitorApi.vcxproj" `
            /m `
            /restore:false `
            /p:Configuration=${{ env.CONFIGURATION }} `
            /p:Platform=${{ env.PLATFORM }} `
            /p:PlatformToolset=v143 `
            /p:WindowsTargetPlatformVersion=10.0 `
            /p:TargetFrameworkVersion=v4.8 `
            /p:UseMultiToolTask=true `
            /p:EnforceProcessCountAcrossBuilds=true `
            /p:CL_MPCount=4 `
            /v:minimal `
            /nologo

      - name: Build TrayS (x64)
        shell: pwsh
        run: |
          msbuild "TrayS\TrayS.vcxproj" `
            /m `
            /restore:false `
            /p:Configuration=${{ env.CONFIGURATION }} `
            /p:Platform=${{ env.PLATFORM }} `
            /p:PlatformToolset=v143 `
            /p:WindowsTargetPlatformVersion=10.0 `
            /p:UseMultiToolTask=true `
            /p:EnforceProcessCountAcrossBuilds=true `
            /p:CL_MPCount=4 `
            /v:minimal `
            /nologo

      - name: Stage artifacts
        shell: pwsh
        run: |
          $out = "artifacts\TrayS-x64-${{ env.CONFIGURATION }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $exe = "build\bin\${{ env.PLATFORM }}\${{ env.CONFIGURATION }}\TrayS.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "Expected build output missing: $exe" }
          Copy-Item $exe $out

          $dll = "build\bin\${{ env.PLATFORM }}\${{ env.CONFIGURATION }}\OpenHardwareMonitorApi.dll"
          if (-not (Test-Path -LiteralPath $dll)) { throw "Expected build output missing: $dll" }
          Copy-Item $dll $out
          Copy-Item "OpenHardwareMonitorApi\LibreHardwareMonitorLib.dll" $out
          Copy-Item "TrayS\WinRing0x64.sys" $out -ErrorAction SilentlyContinue

          # Optional companion import lib if produced next to the DLL
          $lib = Join-Path (Split-Path $dll) "OpenHardwareMonitorApi.lib"
          if (Test-Path $lib) { Copy-Item $lib $out }

          Get-ChildItem $out | Format-Table Name, Length -AutoSize
          Write-Host "Staged from exe=$exe dll=$dll"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TrayS-x64-${{ env.CONFIGURATION }}
          path: artifacts/TrayS-x64-${{ env.CONFIGURATION }}/
          if-no-files-found: error
          retention-days: 30
